[project]
name = "formatix"
version = "0.1.0"
description = "Fast, lightweight, 100% offline batch image converter and resizer for Windows."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pillow-heif>=1.8.1",
    "resvg-py>=0.5.0",
    "tkinterdnd2>=0.6.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
